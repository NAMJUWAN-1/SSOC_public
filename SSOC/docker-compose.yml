version: '3.8'

services:
  # 1. 백엔드 (Django)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: on-failure
    ports:
      - "18000:8000"
    environment:
      # Django settings.py에서 사용할 환경 변수들
      SECRET_KEY: "django-insecure-secret-key-for-dev"
      DEBUG: "True"
      DB_HOST: "ssafy_db"

      # 도커 내부 통신용 AI 서비스 주소
      AI_SERVICE_URL: "http://ai:8001"
    networks:
      - ssoc-network

  # 2. 프론트엔드 (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure
    ports:
      - "15173:5173"
    environment:
      # 브라우저(Host)에서 백엔드 API를 호출할 때 사용하는 주소
      VITE_API_URL: https://i14b209.p.ssafy.io/api
    volumes:
      - ./frontend:/app
      - /app/node_modules # 로컬 node_modules 덮어쓰기 방지
    networks:
      - ssoc-network

  # 3. AI 서비스 (FastAPI)
  ai:
    build:
      context: ./AI  # 폴더명 'ai' 확인
      dockerfile: Dockerfile
    container_name: ai
    restart: on-failure
    ports:
      - "18001:8001"
    environment:
      # GMS 사용을 위한 API Key (.env 파일에서 로드)
      GMS_KEY: ${GMS_KEY}
    networks:
      - ssoc-network

networks:
  ssoc-network:
    external: true
